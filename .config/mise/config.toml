[tools]
# Programming languages
bun = "1"
go = "latest"
lua = "5.4"
node = "24"
pnpm = "10"
ruby = "3.4"
terraform = "1.16"
yarn = "1.22"

# Match Skipr's tools/go_lint_all.sh pin to avoid different lint verdicts.
# Skipr's Makefile installs mockery and protoc-gen-go itself.
"golangci-lint" = "2.1.6"
"go:github.com/gotesttools/gotestfmt/v2/cmd/gotestfmt" = "latest"
"go:golang.org/x/tools/cmd/goimports" = "latest"
shfmt = "latest"

# NPM packages
# Allow low downloads for TickTick's official package only.
# Use ticktick-cli; .zshrc reserves ticktick for the desktop app.
"npm:@ticktick/ticktick-cli" = { version = "latest", allow_low_downloads = true }
"npm:hunkdiff" = "latest"
"npm:skills" = "latest"