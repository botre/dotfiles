os:
  # .zshrc starts the standalone RPC server. Inside Neovim, use $NVIM and close
  # the embedded lazygit first. Neovim opens files locally if no server listens.
  edit: >-
    if [ -z "$NVIM" ]; then nvim --server /tmp/nvim-server.pipe --remote-tab {{filename}};
    else nvim --server "$NVIM" --remote-send "q" && nvim --server "$NVIM" --remote-tab {{filename}}; fi
  editAtLine: >-
    if [ -z "$NVIM" ]; then nvim --server /tmp/nvim-server.pipe --remote-tab {{filename}};
    else nvim --server "$NVIM" --remote-send "q" && nvim --server "$NVIM" --remote-tab {{filename}}
    && nvim --server "$NVIM" --remote-send ":{{line}}<CR>"; fi

promptToReturnFromSubprocess: false
